<!-- NETPIE HTML widget: system state banner. Paste into an HTML widget (Height Blocks: 2).
     NETPIE replaces each dollar-brace #[...] reference with the current value before the script runs.
     Do not write that reference syntax in comments: NETPIE evaluates it everywhere in this widget.
     Device alias must be EV_Gateway. See dashboard/field-mapping.md section 5. -->
<div id="sb-banner" style="padding:14px 10px;border-radius:6px;color:#fff;font:600 22px/1.3 sans-serif;text-align:center"></div>
<div id="sb-sub" style="margin-top:6px;font:14px/1.4 sans-serif;text-align:center;color:#555"></div>
<script>
(function () {
  var STALE_MS = 5000; // placeholder until the contract defines the Node timeout
  function raw(v) { v = String(v); return (v === "" || v === "null" || v === "undefined") ? null : v; }

  var online   = raw("${#["EV_Gateway"]["status"]}") === "1";
  var state    = raw("${#["EV_Gateway"]["shadow"]["state"]}");
  var cutRaw   = raw("${#["EV_Gateway"]["shadow"]["power_cut"]}");
  var powerCut = cutRaw === "true";
  var ageRaw   = raw("${#["EV_Gateway"]["shadow"]["node_age_ms"]}");
  var ageMs    = ageRaw === null ? null : Number(ageRaw);

  var STATES = {
    STARTING:     ["#1565C0", "Starting up"],
    NORMAL:       ["#2E7D32", "Normal"],
    WARNING:      ["#F9A825", "Warning: check the battery"],
    HAZARD:       ["#C62828", powerCut ? "HAZARD: charging power cut" : "HAZARD: power cut NOT confirmed"],
    SENSOR_ERROR: ["#6A1B9A", "Sensor error"]
  };
  var s = STATES[state] || ["#616161", state === null ? "No data yet" : "Unknown state: " + state];
  var colour = s[0], text = s[1];
  if (!online) { colour = "#616161"; text = "OFFLINE: Gateway not connected" + (state ? " (last known: " + state + ")" : ""); }

  var sub = "Charging power: " + (cutRaw === null ? "unknown" : powerCut ? "CUT" : "supplied");
  if (ageMs === null || isNaN(ageMs)) sub += " · Node data: none";
  else if (ageMs > STALE_MS)          sub += " · Node data STALE (" + (ageMs / 1000).toFixed(1) + " s old)";
  else                                sub += " · Node data " + (ageMs / 1000).toFixed(1) + " s old";

  var b = document.getElementById("sb-banner");
  b.style.background = colour;
  b.textContent = text;
  document.getElementById("sb-sub").textContent = sub;
})();
</script>
