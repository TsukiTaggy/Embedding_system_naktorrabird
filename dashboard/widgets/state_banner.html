<!-- NETPIE HTML widget: system state banner with status chips (Height Blocks: 3).
     NETPIE replaces each dollar-brace #[...] reference with the current value before the script runs.
     Do not write that reference syntax in comments: NETPIE evaluates it everywhere in this widget.
     Device alias must be EV_Gateway. See dashboard/field-mapping.md section 5. -->
<style>
  /* NETPIE's freeboard theme draws widget text white, but its panes are white.
     These rules make Text-widget units readable on every pane of this dashboard. */
  .tw-unit { color: #5F6670 !important; }
</style>
<div id="sb-banner" style="border-radius:10px;padding:16px 18px;font-family:Inter,system-ui,sans-serif">
  <div id="sb-title" style="font:700 26px/1.25 Inter,system-ui,sans-serif"></div>
  <div id="sb-chips" style="display:flex;flex-wrap:wrap;gap:8px;margin-top:12px"></div>
</div>
<script>
(function () {
  var STALE_MS = 5000; // placeholder until the contract defines the Node timeout
  function raw(v) { v = String(v); return (v === "" || v === "null" || v === "undefined") ? null : v; }

  var online   = raw("${#["EV_Gateway"]["status"]}") === "1";
  var state    = raw("${#["EV_Gateway"]["shadow"]["state"]}");
  var cutRaw   = raw("${#["EV_Gateway"]["shadow"]["power_cut"]}");
  var powerCut = cutRaw === "true";
  var ageRaw   = raw("${#["EV_Gateway"]["shadow"]["node_age_ms"]}");
  var ageMs    = ageRaw === null ? null : Number(ageRaw);
  var upRaw    = raw("${#["EV_Gateway"]["shadow"]["timestamp_ms"]}");
  var upS      = upRaw === null ? null : Math.floor(Number(upRaw) / 1000);

  var STATES = {
    STARTING:     ["#1565C0", "#FFFFFF", "Starting up"],
    NORMAL:       ["#1E7B34", "#FFFFFF", "Normal"],
    WARNING:      ["#F2B01E", "#1B1F24", "Warning: check the battery"],
    HAZARD:       ["#B3261E", "#FFFFFF", powerCut ? "HAZARD: charging power cut" : "HAZARD: power cut NOT confirmed"],
    SENSOR_ERROR: ["#6A1B9A", "#FFFFFF", "Sensor error"]
  };
  var s = STATES[state] || ["#4F565E", "#FFFFFF", state === null ? "No data yet" : "Unknown state: " + state];
  var bg = s[0], fg = s[1], title = s[2];
  if (!online) { bg = "#4F565E"; fg = "#FFFFFF"; title = "OFFLINE: Gateway not connected" + (state ? " (last known: " + state + ")" : ""); }

  var chipBg = fg === "#FFFFFF" ? "rgba(255,255,255,0.16)" : "rgba(0,0,0,0.08)";
  var nodeText;
  if (ageMs === null || isNaN(ageMs)) nodeText = "Node data: none";
  else if (ageMs > STALE_MS)          nodeText = "Node data STALE (" + (ageMs / 1000).toFixed(1) + " s old)";
  else                                nodeText = "Node data " + (ageMs / 1000).toFixed(1) + " s old";
  var chips = [
    [online ? "#7CE38B" : "#C3C8CE", online ? "Gateway online" : "Gateway OFFLINE"],
    [powerCut ? "#FFFFFF" : null, "Charging power: " + (cutRaw === null ? "unknown" : powerCut ? "CUT" : "supplied")],
    [null, nodeText],
    [null, "Uptime " + (upS === null ? "—" : Math.floor(upS / 60) + "m " + (upS % 60) + "s")]
  ];

  var b = document.getElementById("sb-banner");
  b.style.background = bg;
  b.style.color = fg;
  document.getElementById("sb-title").textContent = title;
  var box = document.getElementById("sb-chips");
  box.innerHTML = "";
  for (var i = 0; i < chips.length; i++) {
    var c = document.createElement("span");
    c.style.cssText = "display:inline-flex;align-items:center;gap:8px;padding:6px 12px;border-radius:8px;font:600 14px Inter,system-ui,sans-serif;background:" + chipBg + ";color:" + fg;
    if (chips[i][0]) {
      var dot = document.createElement("span");
      dot.style.cssText = "width:10px;height:10px;border-radius:50%;background:" + chips[i][0];
      c.appendChild(dot);
    }
    c.appendChild(document.createTextNode(chips[i][1]));
    box.appendChild(c);
  }
})();
</script>
